name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl make python3 shellcheck squashfs-tools
      - name: Lint, test, build and inspect both architectures
        run: make check
      - name: Package and verify release assets
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/package.py --repository "$REPOSITORY" --tag "v$(cat VERSION)"
          python3 tests/verify_release.py
          shellcheck release/install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatcar-wings-build
          path: release/
          if-no-files-found: error
          retention-days: 7
